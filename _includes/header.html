<header class="site-masthead">
  <div class="masthead-identity">
    <a class="masthead-mark" href="{{ "/about.html" | prepend: site.baseurl }}" aria-label="About me">
      <img src="https://www.gravatar.com/avatar/{{ site.author_gravatar }}.png?s=128" alt="">
    </a>
    <div class="masthead-copy">
      <a class="site-title" href="{{ "/" | prepend: site.baseurl }}">{{ site.author_name }}</a>
      <p>{{ site.description }}</p>
    </div>
  </div>

  {% if site.show_social_icons %}
    {% include social_links.html %}
  {% endif %}
</header>
