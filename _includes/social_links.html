<nav class="social-icons" aria-label="Elsewhere">
  {% if site.github_username %}
    <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub">gh</a>
  {% endif %}
  {% if site.stackoverflow_id %}
    <a href="https://stackoverflow.com/users/{{ site.stackoverflow_id }}" aria-label="Stack Overflow">so</a>
  {% endif %}
  <a href="{{ "/feed.xml" | prepend: site.baseurl }}" aria-label="RSS feed">rss</a>
  {% if site.twitter_username %}
    <a href="https://twitter.com/{{ site.twitter_username }}" aria-label="Twitter">tw</a>
  {% endif %}
  {% if site.linkedin_username %}
    <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn">in</a>
  {% endif %}
  {% if site.medium_id %}
    <a href="https://medium.com/@{{ site.medium_id }}" aria-label="Medium">M</a>
  {% endif %}
</nav>
