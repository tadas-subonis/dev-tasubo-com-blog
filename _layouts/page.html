---
layout: default
---

<article class="page">
  <a class="post-back" href="{{ "/" | prepend: site.baseurl }}">← All notes</a>
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: "Page" }}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>

<div class="page-navigation">
  <a class="home" href="{{ site.baseurl }}/" title="Back to Homepage">Home</a>
</div>
